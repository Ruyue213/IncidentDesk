[project]
name = "incident-desk"
version = "0.3.0b1"
description = "Local service incident diagnosis and evidence workbench"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "third_party/licenses/*.txt"]
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
  "deepagents==0.7.34",
  "langchain-deepseek==1.1.1",
  "langgraph-checkpoint-sqlite==3.1.3",
  "aiosqlite==0.22.1",
  "langchain>=1.4.9,<2",
  "langchain-core>=1.7.6,<2",
  "langgraph>=1.2.20,<2",
  "pydantic>=2,<3",
  "pydantic-settings>=2.16.2",
  "httpx>=0.28.1",
  "jieba>=0.42.1",
  "fastapi>=0.162.2",
  "uvicorn>=0.54.0",
  "sqlalchemy[asyncio]>=2.1.8,<3",
  "prometheus-client>=0.23,<1",
]

[project.scripts]
incidentdesk = "incident_desk.__main__:console_main"

[project.optional-dependencies]
rag = [
    "sentence-transformers>=5,<6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_desk"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/hatch_build.py",
    "/pyproject.toml",
    "/uv.lock",
    "/README.md",
    "/README.zh-CN.md",
    "/LICENSE",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/THIRD_PARTY_NOTICES.md",
    "/third_party/licenses",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
